    <line x1="0" y1="-45" x2="0" y2="45" stroke="url(#cyanGrad)" stroke-width="2" />
    <line x1="-39" y1="-22.5" x2="39" y2="22.5" stroke="url(#cyanGrad)" stroke-width="2" />
    <line x1="-39" y1="22.5" x2="39" y2="-22.5" stroke="url(#cyanGrad)" stroke-width="2" />
    <circle cx="0" cy="-45" r="5" fill="#38BDF8" />
    <circle cx="39" cy="-22.5" r="5" fill="#38BDF8" />
    <circle cx="39" cy="22.5" r="5" fill="#38BDF8" />
    <circle cx="0" cy="45" r="5" fill="#38BDF8" />
    <circle cx="-39" cy="22.5" r="5" fill="#38BDF8" />
    <circle cx="-39" cy="-22.5" r="5" fill="#38BDF8" />
    <circle cx="0" cy="0" r="7" fill="#38BDF8" filter="url(#glow)" />
  </g>
  <text x="100" y="150" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#0284C7" text-anchor="middle" letter-spacing="2">AI NEXUS</text>
